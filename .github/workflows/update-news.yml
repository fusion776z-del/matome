name: Update Morning News

on:
  workflow_dispatch:
  schedule:
    # JST 06:30 = UTC 21:30 前日
    - cron: "30 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare feeds.json
        working-directory: morning_news_digest
        run: |
          if [ ! -f feeds.json ]; then
            cp feeds_sample.json feeds.json
          fi

      - name: Generate morning news HTML
        working-directory: morning_news_digest
        run: |
          python generate_morning_news.py

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p public
          cp morning_news_digest/output/morning_news.html public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
