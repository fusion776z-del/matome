name: Update Morning News

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions の schedule は取りこぼすことがあるため、毎時2回チャンスを作る
    - cron: "17 * * * *"

  push:
    branches:
      - main
    paths:
      - "morning_news_digest/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "ref=${{ github.ref }}"
          echo "time_utc=$(date -u)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: morning_news_digest
        run: pip install -r requirements.txt

      - name: Generate morning news HTML
        working-directory: morning_news_digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_morning_news.py

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p public
          cp morning_news_digest/output/morning_news.html public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
