<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>経済・科学｜注目トピックス（Yahoo!）</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--text:#e8eeff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans JP,Meiryo,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:800px;margin:0 auto;padding:16px}
header{position:sticky;top:0;background:var(--bg);padding-bottom:12px}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:12px;opacity:.75}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}
.card h2{margin:0 0 12px;font-size:16px}
.btn{
  display:block;
  width:100%;
  text-align:center;
  padding:18px;
  border-radius:16px;
  font-size:18px;
  font-weight:700;
  border:1px solid var(--line);
  text-decoration:none;
  color:var(--text);
  background:rgba(255,255,255,.08);
}
</style>
</head>
<body>

<div class="wrap">
<header>
<h1>経済・科学｜注目トピックス</h1>
<div class="sub">Yahoo!ニュースが選定する注目分野のみ</div>
</header>

<main class="grid">

<section class="card">
<h2>🇯🇵 経済（注目トピックス）</h2>
<a class="btn" href="https://news.yahoo.co.jp/topics/business" target="_blank" rel="noopener">
Yahoo!で開く
</a>
</section>

<section class="card">
<h2>🔬 科学（注目トピックス）</h2>
<a class="btn" href="https://news.yahoo.co.jp/topics/science" target="_blank" rel="noopener">
Yahoo!で開く
</a>
</section>

<section class="card">
<h2>🌍 世界・国際（注目トピックス）</h2>
<a class="btn" href="https://news.yahoo.co.jp/topics/world" target="_blank" rel="noopener">
Yahoo!で開く
</a>
</section>

</main>
</div>

</body>
</html>
