<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>今日の注目TOP10（日本）— Yahoo!トレンド</title>
  <style>
    :root{--bg:#0b1220;--panel:#111a2e;--text:#e8eeff;--muted:#9fb0d0;--line:rgba(255,255,255,.12);--radius:18px;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",Arial,sans-serif;}
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg)}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    h1{margin:0;font-size:20px}
    .badge{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .rank{font-weight:800;font-size:18px;line-height:1}
    .topic{margin:6px 0 0;font-size:16px;font-weight:800;word-break:break-word}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:6px 10px;border-radius:10px;text-decoration:none;font-size:12px;cursor:pointer}
    .btn.primary{border-color:rgba(110,168,255,.55)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>今日の注目TOP10（日本）</h1>
      <div class="badge" id="updated">—</div>
    </header>
    <main class="grid" id="grid"></main>
  </div>

<script>
(async()=>{
  const TRENDS_PROXY = 'https://r.jina.ai/https://trend.yahoo.co.jp/archives/178';
  const grid = document.getElementById('grid');
  const updated = document.getElementById('updated');

  const esc = (s)=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

  // 元記事の深掘り
  const yahooNewsSearch = (q)=>`https://news.yahoo.co.jp/search?p=${encodeURIComponent(q)}`;
  const xSearch = (q)=>`https://x.com/search?q=${encodeURIComponent(q)}&f=live`;

  // 「まとめサイト」相当（ニュースを集約して読めるページ）
  const googleNewsSearch = (q)=>`https://news.google.com/search?q=${encodeURIComponent(q)}&hl=ja&gl=JP&ceid=JP:ja`;
  const bingNewsSearch = (q)=>`https://www.bing.com/news/search?q=${encodeURIComponent(q)}&mkt=ja-JP`;

  async function fetchTop10(){
    const res = await fetch(TRENDS_PROXY, { cache: 'no-store' });
    const txt = await res.text();
    const re = /「([^」]{1,60})」/g;
    const out=[]; let m;
    while((m=re.exec(txt))!==null && out.length<10){
      const w = (m[1]||'').trim();
      if(w && !out.includes(w)) out.push(w);
    }
    return out;
  }

  function render(words){
    grid.innerHTML='';
    words.forEach((w,i)=>{
      const el = document.createElement('section');
      el.className='card';
      el.innerHTML = `
        <div>
          <div class="rank">${i+1}</div>
          <div class="topic">${esc(w)}</div>
        </div>
        <div class="actions">
          <a class="btn" href="${yahooNewsSearch(w)}" target="_blank" rel="noopener noreferrer">Yahooニュース</a>
          <a class="btn" href="${xSearch(w)}" target="_blank" rel="noopener noreferrer">X</a>
          <a class="btn primary" href="${googleNewsSearch(w)}" target="_blank" rel="noopener noreferrer">まとめ(Google)</a>
          <a class="btn" href="${bingNewsSearch(w)}" target="_blank" rel="noopener noreferrer">まとめ(Bing)</a>
        </div>
      `;
      grid.appendChild(el);
    });
  }

  try{
    const list = await fetchTop10();
    render(list);
    updated.textContent = new Date().toLocaleString();
  }catch(e){
    render(['取得失敗']);
  }
})();
</script>
</body>
</html>
