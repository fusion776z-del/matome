<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>今日の注目TOP10（日本）— 要約</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#111a2e; --text:#e8eeff; --muted:#9fb0d0;
      --line:rgba(255,255,255,.12); --shadow:0 18px 45px rgba(0,0,0,.38);
      --radius:18px; --brand:#6ea8ff; --ok:#2dd4bf; --warn:#fbbf24; --bad:#fb7185;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP",
              "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:var(--sans); color:var(--text);
      background: radial-gradient(1200px 600px at 10% 0%, rgba(110,168,255,.18), transparent 55%),
                  radial-gradient(1000px 650px at 100% 20%, rgba(138,92,255,.16), transparent 55%),
                  linear-gradient(180deg, #070c16, var(--bg));
      min-height:100vh;
    }
    .wrap{max-width:1100px; margin:0 auto; padding:22px}
    header{
      display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px;
      margin:6px 0 16px;
    }
    h1{margin:0; font-size:22px; letter-spacing:.2px}
    .sub{color:var(--muted); font-size:13px; line-height:1.55; margin-top:6px}
    .badge{
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid var(--line); background:rgba(255,255,255,.05);
      padding:8px 10px; border-radius:999px; color:var(--muted); font-size:12px;
    }

    .topbar{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
      margin: 10px 0 14px;
    }
    .hint{
      color:var(--muted); font-size:12px; line-height:1.55;
    }
    .btn{
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      transition:.15s ease;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.09)}
    .btn.primary{
      border-color: rgba(110,168,255,.45);
      background: linear-gradient(135deg, rgba(110,168,255,.22), rgba(138,92,255,.20));
    }
    .btn.small{padding:7px 10px;border-radius:12px;font-size:12px}
    .btn.ok{border-color: rgba(45,212,191,.55); background: rgba(45,212,191,.13)}
    .btn.warn{border-color: rgba(251,191,36,.55); background: rgba(251,191,36,.12)}
    .btn.bad{border-color: rgba(251,113,133,.55); background: rgba(251,113,133,.12)}

    .grid{
      display:grid; grid-template-columns: repeat(2, 1fr); gap:12px;
    }
    @media (max-width: 900px){ .grid{grid-template-columns:1fr} }

    .card{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:14px;
      display:flex; flex-direction:column; gap:10px;
    }
    .head{
      display:flex; gap:10px; align-items:flex-start; justify-content:space-between;
    }
    .left{
      display:flex; gap:10px; align-items:flex-start;
      min-width:0;
    }
    .rank{
      width:34px; height:34px; border-radius:12px;
      display:grid; place-items:center;
      background: rgba(110,168,255,.16);
      border:1px solid rgba(110,168,255,.35);
      color: var(--text);
      font-weight:800;
      flex:0 0 auto;
    }
    .topic{
      margin:0;
      font-size:16px;
      font-weight:800;
      line-height:1.35;
      word-break:break-word;
    }
    .meta{
      color:var(--muted); font-size:12px; margin-top:4px;
    }
    .actions{
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;
      flex:0 0 auto;
    }
    .summary{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 16px;
      padding: 10px 12px;
      display:none;
    }
    .summary .label{
      font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:10px;
      align-items:center;
      margin-bottom:6px;
    }
    .summary .text{
      font-size:13px; line-height:1.65; color:rgba(232,238,255,.92);
      white-space:pre-wrap;
    }
    .mono{font-family:var(--mono)}
    a.link{
      color: var(--brand);
      text-decoration:none;
    }
    a.link:hover{text-decoration:underline}

    .toast{
      position:fixed; right:18px; bottom:18px;
      background: rgba(17,26,46,.92);
      border:1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      color: var(--text);
      display:none;
      max-width: 360px;
      font-size:13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>今日の注目TOP10（日本）— 要約</h1>
        <div class="sub">
          ボタンを押すと、そのトピックを <strong>Wikipedia（日本語）の要約</strong>として表示します（自分用）。<br/>
          出典のランキングは「Googleトレンドワードランキング」（2026/04/23 01:45 更新）上位10件。
        </div>
      </div>
      <div class="badge">
        参照元: trend-calendar（Google） / <span class="mono">2026-04-23 01:45</span>
      </div>
    </header>

    <div class="topbar">
      <div class="hint">
        ・要約は Wikipedia のリード文（概要）を取得します。見つからない場合は「該当なし」になります。<br/>
        ・一度取得した要約はブラウザ内にキャッシュ（localStorage）します。
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn small warn" id="btnClearCache">要約キャッシュ削除</button>
        <button class="btn small" id="btnOpenSource">ランキング出典を開く</button>
      </div>
    </div>

    <main class="grid" id="grid"></main>

    <div class="toast" id="toast"></div>
  </div>

<script>
(() => {
  // 出典: トレンドカレンダー「Googleトレンドワードランキング」(2026/04/23 01:45 更新) 上位10件
  // https://jp.trend-calendar.com/
  const SOURCE_URL = "https://jp.trend-calendar.com/";
  const SOURCE_UPDATED = "2026-04-23 01:45";

  const TOPICS = [
    { rank: 1, word: "サンリオ ボンボンドロップシール" },
    { rank: 2, word: "失点" },
    { rank: 3, word: "日ハム" },
    { rank: 4, word: "阪神" },
    { rank: 5, word: "ボートレースびわこ" },
    { rank: 6, word: "池上彰" },
    { rank: 7, word: "紀伊國屋書店" },
    { rank: 8, word: "プロ野球 順位" },
    { rank: 9, word: "ios 27" },
    { rank:10, word: "八村塁" }
  ];

  const CACHE_KEY = "topic-summary-cache.v1"; // { "<topic>": {ts, title, extract, url} }
  const grid = document.getElementById("grid");
  const toastEl = document.getElementById("toast");

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const esc = (s) => String(s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=> toastEl.style.display="none", 2200);
  }

  function loadCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  }
  function saveCache(cache){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
      return true;
    } catch { return false; }
  }

  // Wikipedia REST search → best match title を得て → summary を取得
  async function fetchWikiSummary(query){
    // 1) タイトル検索（最上位1件）
    const searchUrl = `https://ja.wikipedia.org/w/rest.php/v1/search/title?q=${encodeURIComponent(query)}&limit=1`;
    const sRes = await fetch(searchUrl, { headers: { "accept": "application/json" } });
    if(!sRes.ok) throw new Error("search_failed");
    const sJson = await sRes.json();
    const first = (sJson && sJson.pages && sJson.pages[0]) ? sJson.pages[0] : null;
    if(!first || !first.title) return { found:false, reason:"not_found" };

    const title = first.title;
    // 2) サマリー取得
    const sumUrl = `https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replaceAll(" ", "_"))}`;
    const dRes = await fetch(sumUrl, { headers: { "accept": "application/json" } });
    if(!dRes.ok) throw new Error("summary_failed");
    const dJson = await dRes.json();

    const extract = dJson.extract || "";
    const pageUrl = (dJson.content_urls && dJson.content_urls.desktop && dJson.content_urls.desktop.page) || `https://ja.wikipedia.org/wiki/${encodeURIComponent(title.replaceAll(" ", "_"))}`;

    if(!extract) return { found:false, reason:"no_extract", title, url: pageUrl };
    return { found:true, title, extract, url: pageUrl };
  }

  function createCard(t){
    const card = document.createElement("section");
    card.className = "card";
    card.dataset.topic = t.word;

    card.innerHTML = `
      <div class="head">
        <div class="left">
          <div class="rank">${t.rank}</div>
          <div style="min-width:0">
            <p class="topic">${esc(t.word)}</p>
            <div class="meta">ランキング更新: <span class="mono">${esc(SOURCE_UPDATED)}</span></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn small primary" data-act="summarize">要約する</button>
          <button class="btn small" data-act="toggle">表示/非表示</button>
        </div>
      </div>

      <div class="summary" id="sum-${t.rank}">
        <div class="label">
          <span>要約（Wikipedia）: <span class="mono" data-role="title">未取得</span></span>
          <span>
            <a class="link" href="#" data-role="open" target="_blank" rel="noopener noreferrer" style="display:none">Wikipediaで開く ↗</a>
          </span>
        </div>
        <div class="text" data-role="text">ボタン「要約する」を押すと表示されます。</div>
      </div>
    `;

    card.addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button");
      if(!btn) return;

      const act = btn.dataset.act;
      const topic = card.dataset.topic;
      const summaryBox = card.querySelector(".summary");
      const titleEl = summaryBox.querySelector('[data-role="title"]');
      const textEl  = summaryBox.querySelector('[data-role="text"]');
      const openEl  = summaryBox.querySelector('[data-role="open"]');

      if(act === "toggle"){
        summaryBox.style.display = (summaryBox.style.display === "none" || !summaryBox.style.display) ? "block" : "none";
        return;
      }

      if(act === "summarize"){
        summaryBox.style.display = "block";
        btn.disabled = true;
        btn.textContent = "取得中…";

        // cache
        const cache = loadCache();
        if(cache[topic] && cache[topic].extract){
          titleEl.textContent = cache[topic].title || "（キャッシュ）";
          textEl.textContent  = cache[topic].extract;
          openEl.href = cache[topic].url || "#";
          openEl.style.display = cache[topic].url ? "inline" : "none";
          btn.disabled = false;
          btn.textContent = "要約する";
          toast("キャッシュから表示しました");
          return;
        }

        try{
          // 軽いディレイ（連打対策）
          await sleep(120);

          const r = await fetchWikiSummary(topic);
          if(!r.found){
            titleEl.textContent = r.title ? r.title : "該当なし";
            textEl.textContent =
              "Wikipediaで一致するページの要約が見つかりませんでした。\n" +
              "（固有名詞が特殊/新語/略語の場合に起きやすいです）";
            openEl.style.display = "none";

            cache[topic] = { ts: Date.now(), title: r.title || "", extract: "", url: r.url || "" };
            saveCache(cache);
            toast("要約は見つかりませんでした");
          } else {
            titleEl.textContent = r.title;
            textEl.textContent  = r.extract;
            openEl.href = r.url;
            openEl.style.display = "inline";

            cache[topic] = { ts: Date.now(), title: r.title, extract: r.extract, url: r.url };
            saveCache(cache);
            toast("要約を取得しました");
          }
        } catch (e){
          titleEl.textContent = "取得失敗";
          textEl.textContent =
            "要約の取得に失敗しました。\n" +
            "・ネットワーク\n・Wikipedia側の制限\n・ブラウザのセキュリティ設定\nなどを確認してください。";
          openEl.style.display = "none";
          toast("取得に失敗しました");
        } finally {
          btn.disabled = false;
          btn.textContent = "要約する";
        }
      }
    });

    return card;
  }

  // render
  TOPICS.forEach(t => grid.appendChild(createCard(t)));

  // top buttons
  document.getElementById("btnClearCache").addEventListener("click", () => {
    try{ localStorage.removeItem(CACHE_KEY); } catch {}
    toast("要約キャッシュを削除しました");
  });
  document.getElementById("btnOpenSource").addEventListener("click", () => {
    window.open(SOURCE_URL, "_blank", "noopener,noreferrer");
  });
})();
</script>
</body>
</html>
``
